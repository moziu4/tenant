[package]
name = "tenant"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.39", features = ["serde"] }
futures-util = "0.3.30"
serde = { version = "1.0", features = ["derive"] }
mongodb = "3.2.3"
tracing = "0.1"
dotenv = "0.15"
actix-web = "4.9.0"
actix-cors = "0.7.0"
async-trait = "0.1.82"
env_logger = "0.11.5"
serde_json = "1.0.128"
redis = { version = "0.28.1", features = ["tokio-comp"] }
thiserror = "2.0.11"
async-nats = { version = "=0.35.1", default-features = false, features = ["ring"] }
perms = { git = "https://github.com/moziu4/perms", branch = "master" }
